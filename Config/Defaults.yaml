game:
  module: 'GameAssembly.dll'
  executable: 'BlazblueEntropyEffect.exe'
  unity_version: '2022.3.62f2'
  il2cpp_version: 31
  type_name_offset: 0x10
  identity_min_type_matches: 3

language: 'zh-CN'

monitor:
  process_check_ms: 2000
  value_check_ms: 750
  rescan_ms: 15000
  stable_rescan_ms: 60000
  scan_chunk_bytes: 1048576
  max_scan_mib: 2048
  max_objects_per_type: 4096
  max_dynamic_refresh_candidates: 100000
  max_resource_value: 1000000
  max_refresh_value: 10000
  max_write_candidates: 16

window:
  width: 1100
  height: 800

hotkeys:
  refresh_add: '1'
  exchange_add: '2'
  ap_add: '3'
  potentials_grant: '4'

defaults:
  refresh_set: 1
  refresh_add: 400
  exchange_set: 1
  exchange_add: 2000
  ap_set: 1
  ap_add: 6200

puerts_runtime:
  model_script: 'Data/Js/Server/Model/BreedDungeon.js'
  model_map_field: 'ForceMapName'
  singleton_field: '_instance'

type_info:
  STFesActor:
    rva: 0x52f4e20
    class_name: 'STFesActor'
  STBreedDungeon:
    rva: 0x52f2c58
    class_name: 'STBreedDungeon'
  STBreedDungeonDevice:
    rva: 0x52f2dd0
    class_name: 'STBreedDungeonDevice'
  STBreedDungeonRoom:
    rva: 0x52f33b0
    class_name: 'STBreedDungeonRoom'
  STBreedDungeonStageSelectRewards:
    rva: 0x52f3818
    class_name: 'STBreedDungeonStageSelectRewards'
  STBreedDungeonRandomInfo:
    rva: 0x5355978
    class_name: 'RandomInfo'
  STBreedDungeonResourceInfo:
    rva: 0x5355af8
    class_name: 'ResourceInfo'
  STBreedDungeonRewardInfo:
    rva: 0x5355c70
    class_name: 'RewardInfo'
  STExploreDungeon:
    rva: 0x52f4ca8
    class_name: 'STExploreDungeon'
  DungeonActiveInfo:
    rva: 0x52d5eb8
    class_name: 'DungeonActiveInfo'
  STExploreDungeonRewardInfo:
    rva: 0x5357430
    class_name: 'RewardInfo'
  ExploreDungeonResource:
    rva: 0x52e88d0
    class_name: 'ExploreDungeonResource'
  STBreedDungeonBaseInfo:
    rva: 0x5355210
    class_name: 'BaseInfo'
  STBreedDungeonPhase:
    rva: 0x52f30c0
    class_name: 'STBreedDungeonPhase'

features:
  refresh:
    label: '单人模式刷新次数'
    puerts_array:
      length: 19
      resource_index: 14
      object_length_offset: 0x8
      elements_offset: 0x10
      entry_stride: 0x8
      value_high_word_offset: 0x4
      map_instance_type_offset: 0xc
      parent_properties_offset: 0x8
      parent_elements_offset: 0x10
      fixed_array_instance_type: 0x77
      parent_instance_type: 0x421
    roots: []

  exchange:
    label: '兑换点'
    puerts_resource_index: 5

  ap:
    label: 'AP 点'
    model_script: 'Data/Js/Server/Model/PlayerSplitStruct.js'
    prototype_method: 'BuildCurrencyPack'
    currency_id: 1

